# Extended keys for proper key support (Enter, arrows, etc.)
set -g extended-keys on
set -g extended-keys-format csi-u

# Essentials
set -g mouse
set-option -g repeat-time 0
bind-key R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# Keybinds
setw -g mode-keys vi
bind-key h if -F '#{pane_at_left}'   '' 'select-pane -L'
bind-key j if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind-key k if -F '#{pane_at_top}'    '' 'select-pane -U'
bind-key l if -F '#{pane_at_right}'  '' 'select-pane -R'
bind -n C-h run "{ (tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)vim$' && tmux send-keys C-h) || (tmux display-message -p '#{pane_at_left}'   | grep -q 0 && tmux select-pane -L); } ; true"
bind -n C-j run "{ (tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)vim$' && tmux send-keys C-j) || (tmux display-message -p '#{pane_at_bottom}' | grep -q 0 && tmux select-pane -D); } ; true"
bind -n C-k run "{ (tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)vim$' && tmux send-keys C-k) || (tmux display-message -p '#{pane_at_top}'    | grep -q 0 && tmux select-pane -U); } ; true"
bind -n C-l run "{ (tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)vim$' && tmux send-keys C-l) || (tmux display-message -p '#{pane_at_right}'  | grep -q 0 && tmux select-pane -R); } ; true"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'niksingh710/minimal-tmux-status'

set -g @minimal-tmux-use-arrow true
set -g @minimal-tmux-right-arrow ""
set -g @minimal-tmux-left-arrow ""
set -g @minimal-tmux-bg green
set -g @minimal-tmux-fg black
set -g pane-border-style 'fg=black'

set -g status-interval 1
set -g @minimal-tmux-status-right-extra " %H:%M  "

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# NOTE: On Linux (Debian/Ubuntu), install TPM via your package manager or clone manually
# On macOS, TPM is typically installed via Homebrew
run '~/.tmux/plugins/tpm/tpm'
